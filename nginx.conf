# Количество рабочих процессов = количеству ядер CPU
worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # =====================================================
    # ЗОНЫ ЛИМИТОВ
    # 10m = 10 мегабайт памяти для хранения счётчиков
    # rate = максимальная частота запросов
    # =====================================================

    # Общий лимит: 20 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # Лимит на вход/регистрацию: 5 запросов в минуту
    # Защита от перебора паролей
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Лимит на запись (POST/PUT/DELETE): 30 в минуту
    limit_req_zone $binary_remote_addr zone=write:10m rate=30r/m;

    # Лимит одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # HTTP-код при превышении лимита (429 = Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;

    # =====================================================
    # ЗАЩИТА ОТ SLOWLORIS И МЕДЛЕННЫХ АТАК
    # Slowloris: атакующий открывает много соединений
    # и очень медленно шлёт заголовки — держит сервер занятым
    # =====================================================
    client_header_timeout 10s;   # ждём заголовки не дольше 10 сек
    client_body_timeout   10s;   # ждём тело запроса не дольше 10 сек
    send_timeout          10s;   # ждём клиента при отправке не дольше 10 сек
    keepalive_timeout     15s;   # держим соединение открытым 15 сек
    reset_timedout_connection on; # сбрасываем зависшие соединения

    # =====================================================
    # ОГРАНИЧЕНИЕ РАЗМЕРОВ
    # Защита от атак с огромными телами запросов
    # =====================================================
    client_max_body_size      1m;    # максимум 1 МБ на запрос
    client_body_buffer_size   16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Не показываем версию nginx в заголовках (меньше инфо атакующему)
    server_tokens off;

    # Логи с временем ответа (для анализа атак)
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # =====================================================
    # ЗАГЛУШКА: запросы по IP без Host-заголовка
    # Сканеры и боты часто стучатся по IP напрямую
    # =====================================================
    server {
        listen 80 default_server;
        return 444; # закрываем соединение без ответа
    }

    # =====================================================
    # ОСНОВНОЙ СЕРВЕР
    # =====================================================
    server {
        listen 80;
        server_name sport.example.com; # замени на свой домен

        # Одновременных соединений с одного IP не больше 30
        limit_conn perip 30;

        # Разрешаем только нужные HTTP методы
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
            return 405;
        }

        # --------------------------------------------------
        # /api/v1/auth/login и /register — жёсткий лимит
        # burst=3: разрешаем 3 "лишних" запроса в очередь
        # nodelay: не задерживаем, сразу 429 при превышении
        # --------------------------------------------------
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://127.0.0.1:8080;
            include /etc/nginx/proxy_params;
        }

        # --------------------------------------------------
        # POST/PUT/DELETE запросы — умеренный лимит
        # --------------------------------------------------
        location ~ ^/api/v1/(events|organizations|comments|participations) {
            limit_req zone=write burst=10 nodelay;
            proxy_pass http://app:8080;
            include /etc/nginx/proxy_params;
        }

        # --------------------------------------------------
        # Служебные эндпоинты — закрываем снаружи
        # --------------------------------------------------
        location ~ ^/(actuator|swagger-ui|v3/api-docs) {
            return 404;
        }

        # --------------------------------------------------
        # Всё остальное — общий лимит
        # --------------------------------------------------
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://app:8080;
            include /etc/nginx/proxy_params;
        }
    }
}