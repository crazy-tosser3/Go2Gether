# Количество рабочих процессов = количеству ядер CPU
worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # =====================================================
    # ЗОНЫ ЛИМИТОВ
    # 10m = 10 мегабайт памяти для хранения счётчиков
    # Лимиты рассчитаны на то, что эксперты сидят за одним IP (Wi-Fi площадки)
    # =====================================================

    # Общий лимит: 20 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # Вход/регистрация: 60 в минуту с IP (несколько экспертов за одним NAT)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

    # Запись (POST/PATCH/DELETE). Для GET/HEAD/OPTIONS ключ пустой —
    # nginx такие запросы в этой зоне не считает, чтение ленты не ограничивается
    map $request_method $write_limit_key {
        GET     "";
        HEAD    "";
        OPTIONS "";
        default $binary_remote_addr;
    }
    limit_req_zone $write_limit_key zone=write:10m rate=120r/m;

    # Лимит одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # HTTP-код при превышении лимита (429 = Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;

    # =====================================================
    # АДРЕС БЭКЕНДА — в одном месте
    # nginx на хосте, приложение в Docker с портом 127.0.0.1:8080 → 127.0.0.1:8080
    # nginx тоже в docker compose → поменять на app:8080
    # =====================================================
    upstream stoloto_app {
        server 127.0.0.1:8080;
    }

    # =====================================================
    # ЗАЩИТА ОТ SLOWLORIS И МЕДЛЕННЫХ АТАК
    # =====================================================
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    reset_timedout_connection on;

    # =====================================================
    # ОГРАНИЧЕНИЕ РАЗМЕРОВ
    # =====================================================
    client_max_body_size      1m;
    client_body_buffer_size   16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Не показываем версию nginx в заголовках
    server_tokens off;

    # Логи с временем ответа
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # =====================================================
    # ЗАГЛУШКА: запросы с чужим Host (сканеры по IP)
    # ВНИМАНИЕ: по голому IP сайт не откроется — только по домену из server_name ниже
    # =====================================================
    server {
        listen 80 default_server;
        return 444;
    }

    # =====================================================
    # ОСНОВНОЙ СЕРВЕР
    # =====================================================
    server {
        listen 80;
        server_name sport.example.com; # замени на свой домен

        # Одновременных соединений с одного IP не больше 30
        limit_conn perip 30;

        # Разрешаем только нужные HTTP методы (PATCH — редактирование)
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
            return 405;
        }

        # --------------------------------------------------
        # Вход и регистрация — отдельный лимит
        # --------------------------------------------------
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://stoloto_app;
            include /etc/nginx/proxy_params;
        }

        # --------------------------------------------------
        # Запись в основные ресурсы. GET сюда тоже попадает,
        # но зона write его не считает (см. map выше)
        # --------------------------------------------------
        location = /api/v1/users/me/avatar {
            client_max_body_size 6m;
            limit_req zone=write burst=10 nodelay;
            proxy_pass http://app:8080;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/(events|organizations|comments|participations) {
            limit_req zone=write   burst=30 nodelay;
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://stoloto_app;
            include /etc/nginx/proxy_params;
        }

        # --------------------------------------------------
        # Служебные эндпоинты — закрываем снаружи
        # --------------------------------------------------
        location ~ ^/(actuator|swagger-ui|v3/api-docs) {
            return 404;
        }

        # --------------------------------------------------
        # Всё остальное (остальное API и фронт) — общий лимит
        # --------------------------------------------------
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://stoloto_app;
            include /etc/nginx/proxy_params;
        }
    }
}