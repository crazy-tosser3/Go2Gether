name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Формат заголовка PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+' \
            || { echo "Заголовок PR: <тип>(<скоуп>): <описание по-русски>"; exit 1; }
          printf '%s' "$TITLE" | grep -qP '\p{Cyrillic}' || { echo "Описание в заголовке PR — по-русски"; exit 1; }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Менеджер пакетов
        id: pm
        run: |
          if [ ! -f package.json ]; then echo "pm=none" >> "$GITHUB_OUTPUT"; echo "package.json ещё нет — пропускаю"; exit 0; fi
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pm == 'pnpm'
      - uses: actions/setup-node@v5
        if: steps.pm.outputs.pm != 'none'
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.pm.outputs.pm }}
      - name: Зависимости
        if: steps.pm.outputs.pm != 'none'
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac
      - name: Проверки (lint, typecheck, test, build — какие есть в package.json)
        if: steps.pm.outputs.pm != 'none'
        run: |
          pm="${{ steps.pm.outputs.pm }}"
          for s in lint typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
              echo "== $s"; $pm run $s
            else
              echo "== $s: скрипта нет, пропускаю"
            fi
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Зависимости
        run: pnpm install --frozen-lockfile
      - name: Браузер для e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Сценарии С1–С6 в браузере
        run: pnpm e2e
      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ci:
    if: always()
    needs: [pr-title, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Итог
        run: |
          for r in "${{ needs.pr-title.result }}" "${{ needs.web.result }}" "${{ needs.e2e.result }}"; do
            case "$r" in success|skipped) ;; *) echo "есть упавшие проверки: $r"; exit 1 ;; esac
          done
