spring.application.name=STOLOTO

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Stoloto}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:123456}


spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=stoloto:cache:


spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.datatype.enum.write-enums-to-lowercase=true
spring.jackson.mapper.accept-case-insensitive-enums=true


app.jwt.secret=${JWT_SECRET:c3RvbG90by1kZXYtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4}
app.jwt.ttl=${JWT_TTL:24h}
app.jwt.issuer=stoloto


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**

management.endpoints.web.exposure.include=health,metrics


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.forward-headers-strategy=framework

app.avatars.dir=${AVATARS_DIR:data/avatars}
app.avatars.public-url=${AVATARS_PUBLIC_URL:}
app.zone=${APP_ZONE:Asia/Krasnoyarsk}
