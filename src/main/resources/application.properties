spring.application.name=STOLOTO

# Redis — основное хранилище данных и токенов
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JSON: snake_case, енамы в нижнем регистре (open, approval, pending ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.datatype.enum.write-enums-to-lowercase=true
spring.jackson.mapper.accept-case-insensitive-enums=true

# JWT (HS256). В проде обязательно задать JWT_SECRET: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:c3RvbG90by1kZXYtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4}
app.jwt.ttl=${JWT_TTL:24h}
app.jwt.issuer=stoloto

# Демо-данные (демо-аккаунты, направления, пара событий)
app.seed.enabled=${SEED_ENABLED:true}
