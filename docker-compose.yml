services:
  postgres:
    image: postgres:18
    container_name: StolotoHack
    restart: unless-stopped
    env_file:
      - docker-env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: StolotoHackRedis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: STOLOTO
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - docker-env
    environment:
      AVATARS_DIR: /app/data/avatars
    volumes:
      - avatars_data:/app/data/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  avatars_data:
