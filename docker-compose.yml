services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sport_db        # ← вот тут БД создаётся сама
      POSTGRES_USER: sport_user
      POSTGRES_PASSWORD: sport_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: